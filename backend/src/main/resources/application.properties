spring.application.name=algolab

# --- DB 연결 (username/password는 application-local.properties) ---
#spring.datasource.url=jdbc:mysql://localhost:3306/algolab

# --- JPA ---
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# --- 실행되는 SQL 확인 ---
logging.level.org.hibernate.SQL=debug
spring.jpa.properties.hibernate.format_sql=true